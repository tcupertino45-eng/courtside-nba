async function initAdvanced(pid, token, careerJson) {
  const body = document.getElementById('adv-body');
  if (!body) return;
  let stats;
  const hustleP = loadHustle().catch(e => ({ error: e }));
  const defP = loadDefense();
  try { stats = await prepareSeason(); }
  catch (e) { if (token === renderToken) body.innerHTML = `<div class="empty">Não foi possível carregar as estatísticas da liga para calcular os números avançados.</div>`; return; }
  if (token !== renderToken) return;
  const L = stats.leagueTeam;
  const found = stats.find(s => s.id === String(pid));
  let me = found;
  if (found && (found.oreb == null || found.dreb == null) && careerJson) {
    const cats = careerJson.categories || [];
    const avgC = cats.find(c => /average/i.test(c.name || c.displayName)) || cats[0];
    const labels = avgC?.labels || avgC?.names || [];
    const rows = avgC?.statistics || [];
    const last = rows[rows.length - 1]?.stats || [];
    const at = l => toNum(last[labels.indexOf(l)]);
    me = { ...found, oreb: found.oreb ?? at('OR') ?? at('OREB'), dreb: found.dreb ?? at('DR') ?? at('DREB') };
  }
  const noLeagueReb = !stats.some(s => s.oreb != null);
  if (!me || !me.gp) { body.innerHTML = `<div class="empty">O jogador ainda não entrou em quadra nesta temporada.</div>`; return; }
  // Base de comparação: jogadores com volume razoável (metade dos jogos do líder e 12+ minutos)
  const maxGp = Math.max(1, ...stats.map(s => s.gp || 0));
  const pool = stats.filter(s => (s.gp || 0) >= Math.max(1, Math.ceil(maxGp * 0.5)) && (s.min || 0) >= 12).map(s => computeAdvanced(s, L)).filter(Boolean);
  const mine = computeAdvanced(me, L);
  // Contestações (fonte NBA.com): jogador e base de comparação próprios
  const [hu, def] = await Promise.all([hustleP, defP]);
  if (token !== renderToken) return;
  const hRows = hu.rows || [];
  const meKey = normName(me.name);
  const hMe = hRows.find(r => r.key === meKey && (!me.team || r.team === me.team)) || hRows.find(r => r.key === meKey);
  Object.assign(mine, hustleRates(hMe) || {});
  const hMaxG = Math.max(1, ...hRows.map(r => r.g || 0));
  const hPool = hRows.filter(r => (r.g || 0) >= Math.ceil(hMaxG * 0.5) && r.min / r.g >= 12).map(hustleRates).filter(Boolean);
  const hNote = hu.error ? ' As contestações não carregaram (' + hu.error.message + ').'
    : !hMe ? ' Contestações: jogador não encontrado nos dados de rastreamento da NBA desta temporada.'
    : ` Contestações: rastreamento óptico da NBA.com, ${hPool.length} jogadores na base do percentil.`;
  const pctile = (c, v) => {
    if (v == null || !isFinite(v)) return null;
    const vals = (c.src === 'h' ? hPool : pool).map(a => a[c.k]).filter(x => x != null && isFinite(x));
    if (vals.length < 10) return null;
    const below = vals.filter(x => x < v).length, eq = vals.filter(x => x === v).length;
    const p = Math.round(100 * (below + eq / 2) / vals.length);
    return c.low ? 100 - p : p;
  };
  const avg = c => { const vals = (c.src === 'h' ? hPool : pool).map(a => a[c.k]).filter(x => x != null && isFinite(x)); return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null; };
  const pClass = p => p == null ? '' : p >= 67 ? 'pc-hi' : p <= 33 ? 'pc-lo' : '';
  const qualified = (me.gp || 0) >= Math.ceil(maxGp * 0.5) && me.min >= 12;

  const draw = side => {
    const groups = ADV[side];
    groups.forEach(g => g.cols.forEach(c => { if (g.src) c.src = g.src; }));
    body.innerHTML = `<div class="table-wrap"><table class="adv-table">
      <thead><tr><th rowspan="2" class="adv-corner"></th>${groups.map(g => `<th colspan="${g.cols.length}" class="adv-group">${g.g}</th>`).join('')}</tr>
        <tr>${groups.map((g, gi) => g.cols.map((c, ci) => `<th class="${ci === 0 && gi > 0 ? 'gsep' : ''}" tabindex="0" data-tip="${esc(c.tip)}">${c.l}</th>`).join('')).join('')}</tr></thead>
      <tbody><tr><th scope="row">${esc(me.name.split(' ').slice(-1)[0])}</th>${groups.map((g, gi) => g.cols.map((c, ci) => {
          const v = mine[c.k], p = pctile(c, v);
          return `<td class="${ci === 0 && gi > 0 ? 'gsep' : ''}"><div class="adv-v">${fmtAdv(c, v)}</div><div class="adv-p ${c.neutral ? '' : pClass(p)}">${p == null ? '' : p}</div></td>`;
        }).join('')).join('')}</tr>
        <tr class="adv-avg"><th scope="row">Média da liga</th>${groups.map((g, gi) => g.cols.map((c, ci) => `<td class="${ci === 0 && gi > 0 ? 'gsep' : ''}">${fmtAdv(c, avg(c))}</td>`).join('')).join('')}</tr></tbody>
    </table></div>
    <p class="note">Passe o mouse (ou toque) no nome de uma estatística para ver a explicação. O número pequeno é o percentil: ${pool.length} jogadores com volume de jogo comparável; 90 significa melhor que 90% deles. Azul = percentil alto, vermelho = baixo.${noLeagueReb && side === 'ataque' || noLeagueReb && side === 'defesa' ? ' ORB%, DRB% e DREB/36 aparecem sem percentil porque a ESPN não informa rebotes ofensivos e defensivos da liga inteira.' : ''}${qualified ? '' : ' Este jogador ainda tem poucos jogos ou minutos, então os números podem oscilar bastante.'}${side === 'defesa' ? hNote + ' ' : ''}</p>${side === 'defesa' ? dfgPanel(def, me) : ''}`;
  };
  document.querySelectorAll('#adv-side [data-side]').forEach(b => b.onclick = () => {
    document.querySelectorAll('#adv-side [data-side]').forEach(x => x.setAttribute('aria-checked', x === b));
    draw(b.dataset.side);
  });
  draw('ataque');
}

/* Dica flutuante para qualquer elemento com data-tip (mouse, foco do teclado e toque) */
(function tooltips() {
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip');
  document.body.appendChild(tip);
  let cur = null;
  const show = el => {
    cur = el; tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, innerWidth - w - 8));
    let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el && el !== cur) show(el); else if (!el && cur) hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); el ? show(el) : hide(); });
  document.addEventListener('click', e => { const el = e.target.closest('[data-tip]'); if (el) show(el); else hide(); });
  addEventListener('scroll', hide, true);
})();

        <td style="color:${r.ok === true ? 'var(--good)' : r.ok === false ? 'var(--live)' : 'var(--muted)'}">${r.ok == null ? 'testando…' : r.ok ? 'OK' : esc(r.err)}</td></tr>`).join('')}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  switch (parts[0]) {
    case 'jogo': return viewGame(parts[1]);
    case 'jogadores': return viewPlayers(parts[1] === 'tabela' ? 'tabela' : 'lideres');
    case 'jogador': return viewPlayer(parts[1]);
    case 'diagnostico': return viewDiag();
    case 'comparar': return viewCompare(parts[1], parts[2]);
    case 'jogos': default: return viewGames(parts[0] === 'jogos' ? parts[1] : undefined);
  }
}
window.addEventListener('hashchange', route);
