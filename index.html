<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courtside NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: placar de arena no topo, conteúdo em coluna única de até 1100px; tabelas roláveis horizontalmente. */
:root {
  --bg: #f3f2ef;          /* madeira clara da quadra, dessaturada */
  --surface: #ffffff;
  --ink: #16181d;
  --muted: #5d6270;
  --line: #dcdad4;
  --accent: #d4561c;      /* couro da bola */
  --accent-ink: #ffffff;
  --live: #d0263a;
  --good: #1f7a4d;
  --led: #16181d;         /* fundo do placar */
  --led-text: #ffb547;
  --above: #2b66b0;       /* zona acima da média da liga */
  --below: #c9362b;       /* zona abaixo da média */
  --court: #fbfaf7;       /* piso do mapa de arremessos */
  --gold: #e3b341;         /* duelo de top 4 */
  --gold-ink: #2b1d00;
  --gold-text: #9a6d00;
  --sky: #9fd3fa;         /* azul claro: botão Comparar e aviso de jogo hoje */
  --sky-ink: #0b2a44;
  --sky-text: #1d6fa8;     /* azul claro legível como texto no tema claro */
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;  /* números e rótulos: mesma família do texto, com algarismos tabulares */
  --font-led: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;  /* só o placar estilo telão */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #181b21; --ink: #eceae4; --muted: #9a9fab; --line: #2a2e37;
    --accent: #f07a3c; --accent-ink: #101216; --live: #ff5468; --good: #4fc58a;
    --led: #07080a; --led-text: #ffbe5c; --above: #5c9ae6; --below: #ff6a55; --court: #14171c; --gold: #e8b84a; --gold-ink: #241800; --gold-text: #f0c86a; --sky: #7cc3f2; --sky-ink: #06192a; --sky-text: #7cc3f2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #181b21; --ink: #eceae4; --muted: #9a9fab; --line: #2a2e37;
  --accent: #f07a3c; --accent-ink: #101216; --live: #ff5468; --good: #4fc58a;
  --led: #07080a; --led-text: #ffbe5c; --above: #5c9ae6; --below: #ff6a55; --court: #14171c; --gold: #e8b84a; --gold-ink: #241800; --gold-text: #f0c86a; --sky: #7cc3f2; --sky-ink: #06192a; --sky-text: #7cc3f2; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.wrap > *, .section > * { min-width: 0; }

/* Cabeçalho */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 12px max(16px, env(safe-area-inset-left, 0px));
}
.top-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font: 800 24px/1 var(--font-display); letter-spacing: .01em; text-transform: uppercase; text-decoration: none; }
.brand span { color: var(--accent); }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs a {
  text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--muted);
}
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.005em; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
.eyebrow { font: 600 11px/1.3 var(--font-data); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sky { background: var(--sky); color: var(--sky-ink); border-color: var(--sky); font-weight: 600; text-decoration: none; }
.btn.sky:hover { border-color: var(--sky-ink); }
input[type="search"], select {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 6px; min-width: 0;
}

/* Pílulas de estado */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--font-data); letter-spacing: .04em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.live { color: var(--sky-ink); background: var(--sky); border-color: var(--sky); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sky-ink); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }

/* Grade de jogos */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.game {
  display: grid; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; text-decoration: none;
}
.game:hover { border-color: var(--ink); }
.game.is-live { border: 2px solid var(--sky); padding: 13px 15px; }
/* Destaques: clutch (vermelho, pulsante) e top 4 (dourado, estático) */
.game.is-top4 { border-color: var(--gold); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 10%, var(--surface)), var(--surface) 55%); }
.flag-top4 { justify-self: start; font: 700 11px/1 var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); padding: 5px 9px; border-radius: 4px; }
.team-row .seed { display: block; margin-top: 1px; font: 600 11px/1.2 var(--font-data); color: var(--gold-text); }
.game.is-clutch { border: 2px solid var(--accent); padding: 13px 15px; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); animation: clutchRing 1.6s ease-out infinite; }
.flag-clutch { display: flex; align-items: center; gap: 8px; margin: -13px -15px 0; padding: 8px 16px; border-radius: 8px 8px 0 0; background: var(--accent); color: var(--accent-ink); font: 800 13px/1 var(--font-display); letter-spacing: .08em; }
.flag-clutch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); animation: pulse 1s infinite; }
.flag-clutch .flag-sub { margin-left: auto; font: 600 11px var(--font-data); letter-spacing: .02em; opacity: .9; }
.game.is-clutch.is-top4 .flag-top4 { margin-top: 2px; }
@keyframes clutchRing { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@media (prefers-reduced-motion: reduce) { .game.is-clutch, .flag-clutch .dot { animation: none; } }
.hl-legend { display: flex; flex-wrap: wrap; gap: 8px; }
.hl-chip { font: 600 12px var(--font-data); padding: 6px 10px; border-radius: 99px; }
.hl-chip.clutch { background: var(--accent); color: var(--accent-ink); }
.hl-chip.top4 { background: var(--gold); color: var(--gold-ink); }
.game-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.team-row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; }
.team-row img { width: 32px; height: 32px; object-fit: contain; }
.team-row .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-row .rec { font: 12px var(--font-data); color: var(--muted); margin-left: 6px; }
.team-row .score { font: 700 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.team-row.lost .score, .team-row.lost .name { color: var(--muted); }

/* Placar de arena (página do jogo) */
.board {
  background: var(--led); color: #f4f1ea; border-radius: 12px; padding: 20px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
}
.board .side { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.board img { width: clamp(44px, 10vw, 72px); height: auto; }
.board .abbr { font: 800 20px/1 var(--font-display); letter-spacing: .06em; }
.board .pts { font: 600 clamp(44px, 12vw, 84px)/1 var(--font-led); color: var(--led-text); font-variant-numeric: tabular-nums; text-shadow: 0 0 18px color-mix(in srgb, var(--led-text) 45%, transparent); }
.board .mid { display: grid; justify-items: center; gap: 8px; text-align: center; }
.board .clock { font: 600 16px var(--font-led); color: #f4f1ea; }
.board .pill { border-color: #4a4f5a; color: #c9c6be; }
.board .pill.live { border-color: var(--sky); background: var(--sky); color: var(--sky-ink); }

/* Tabelas */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font: 600 11.5px var(--font-data); text-transform: uppercase; letter-spacing: .03em; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
td { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 13.5px; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
td:first-child { font-family: var(--font-body); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
td.hl, th.hl { color: var(--accent); font-weight: 600; }
tr.bench-split td { font: 600 11px var(--font-data); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; background: var(--bg); }
.plink { text-decoration: none; font-weight: 500; }
.plink:hover { color: var(--accent); }

/* Comparação de equipes */
.compare { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.cmp-row { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; }
.cmp-row .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.cmp-row .v:last-child { text-align: right; }
.cmp-bar { display: grid; gap: 4px; }
.cmp-bar .lbl { text-align: center; color: var(--muted); font-size: 12px; }
.cmp-track { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.cmp-track i { display: block; height: 100%; }

/* Jogadas */
.plays { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.plays li { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; border-left: 3px solid transparent; }
.plays .what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.plays .kind { font: 600 10.5px/1 var(--font-data); text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; border-radius: 4px; background: var(--line); color: var(--muted); white-space: nowrap; }
.plays .k-score .kind { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.plays .k-tov .kind { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
.plays .k-eject { border-left-color: var(--live); }
.plays .k-eject .kind { background: var(--live); color: #fff; }
.plays .tm { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--font-data); }
.plays .tm img { width: 18px; height: 18px; object-fit: contain; }
.plays .sc { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.plays .sc > span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.plays .sc b { font-weight: 600; font-size: 14px; }
.plays .sc .won { color: var(--ink); }
.plays .sc .won b { font-weight: 800; }
.plays li:last-child { border-bottom: 0; }
.plays .t { font: 12px var(--font-data); color: var(--muted); }
.plays .sc { font: 600 13px var(--font-data); }

/* Jogadores */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.pcard { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; }
.pcard:hover { border-color: var(--ink); }
.pcard img, .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--line); }
.pcard .n { font-weight: 600; line-height: 1.2; }
.pcard .m { font: 12px var(--font-data); color: var(--muted); }

/* Perfil */
.profile { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: end; }
.profile .photo { width: clamp(110px, 24vw, 180px); aspect-ratio: 1.36; object-fit: cover; object-position: top; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); max-width: 100%; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; }
.facts b { font-weight: 500; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
/* Mapa de arremessos */
.shot-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.court { position: relative; width: 100%; aspect-ratio: 50 / 47; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--court); }
.court canvas, .court svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.court .loading { position: absolute; inset: auto 0 0 0; padding: 8px 12px; font: 12px var(--font-data); color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); }
.zone-lbl { font-family: "IBM Plex Sans", system-ui, sans-serif; text-anchor: middle; paint-order: stroke; stroke: var(--court); stroke-width: .45px; stroke-linejoin: round; fill: var(--ink); }
.shot-summary { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 13px var(--font-data); }
.shot-summary b { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.zones-table td:first-child { white-space: normal; min-width: 150px; }
.diff-pos { color: var(--above); } .diff-neg { color: var(--below); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
td.res-w { color: var(--good); } td.res-l { color: var(--live); }
td .opp { display: inline-flex; align-items: center; gap: 6px; }
td .opp img { width: 18px; height: 18px; }
@media (max-width: 860px) { .shot-layout { grid-template-columns: 1fr; } }

/* Líderes e tabela de jogadores */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg a { padding: 7px 14px; text-decoration: none; font-weight: 500; color: var(--muted); }
.seg a[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.seg-sm { flex-wrap: wrap; }
.minf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.minf input { width: 64px; border: 1px solid var(--line); background: var(--surface); padding: 7px 8px; border-radius: 6px; }
.leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 8px; display: grid; gap: 6px; align-content: start; }
.lead-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lead-head a { text-decoration: none; white-space: nowrap; }
.lead-head a:hover { color: var(--accent); }
.lead-rule { font-size: 12px; color: var(--muted); margin-top: -4px; }
.lead ol { list-style: none; margin: 0; padding: 0; }
.lead li { display: grid; grid-template-columns: 18px 32px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.lead li:first-child { border-top: 0; }
.lead li img, .lead li .avatar { border-radius: 50%; object-fit: cover; background: var(--line); display: block; }
.lead .rk { font: 600 12px var(--font-data); color: var(--muted); text-align: center; }
.lead li:first-child .rk { color: var(--accent); }
.lead .plink { display: grid; min-width: 0; }
.lead .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.lead .lt { font: 11px var(--font-data); color: var(--muted); }
.lead .lv { font: 600 16px var(--font-data); font-variant-numeric: tabular-nums; }
.lead li:first-child .lv { color: var(--accent); }
.table-wrap.tall { max-height: 75vh; overflow: auto; }
table.sortable th[data-k] { cursor: pointer; user-select: none; }
table.sortable th[data-k]:hover { color: var(--ink); }
table.sortable th { z-index: 2; }
table.sortable th:first-child { z-index: 3; }

/* Comparação */
.cmp-add { position: relative; max-width: 520px; }
.cmp-add input { width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; border-radius: 8px; }
.cmp-results { position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); overflow: hidden; }
.cmp-results button { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 0; background: none; text-align: left; cursor: pointer; }
.cmp-results button:hover, .cmp-results button:focus-visible { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.cmp-results img, .cmp-results .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--line); }
.cmp-table th.cmp-stat, .cmp-table tbody th { text-align: left; font: 500 13px var(--font-body); color: var(--ink); text-transform: none; letter-spacing: 0; position: sticky; left: 0; background: var(--surface); z-index: 1; white-space: normal; min-width: 150px; }
.cmp-table th.cmp-stat { font: 600 11px var(--font-data); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); vertical-align: bottom; }
.cmp-table td { text-align: center; font-size: 15px; min-width: 112px; }
.cmp-table td.best { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); font-weight: 600; }
.cmp-table tbody tr:hover td.best { background: color-mix(in srgb, var(--good) 22%, var(--surface)); }
.cmp-col { text-align: center !important; vertical-align: bottom; text-transform: none !important; letter-spacing: 0 !important; }
.cmp-player { position: relative; display: grid; justify-items: center; gap: 4px; padding-top: 4px; font: 500 13px var(--font-body); color: var(--ink); white-space: normal; }
.cmp-player img, .cmp-player .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--line); }
.cmp-x { position: absolute; top: 0; right: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1; color: var(--muted); }
.cmp-x:hover { color: var(--live); border-color: var(--live); }
.cmp-wins { font: 600 11px var(--font-data); color: var(--good); }

/* Pré-jogo */
.pregame { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.pg-team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 18px; }
.pg-head { display: flex; align-items: center; gap: 12px; }
.pg-head img { width: 44px; height: 44px; object-fit: contain; }
.pg-block { display: grid; gap: 8px; }
.pg-block h3 { font-size: 16px; color: var(--muted); }
.pg-note { margin: 0; font-size: 12px; color: var(--muted); }
.pg-list { list-style: none; margin: 0; padding: 0; }
.pg-list li { display: grid; grid-template-columns: 30px 36px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.pg-list li:first-child { border-top: 0; }
.pg-list.inj li { grid-template-columns: 36px minmax(0, 1fr); align-items: start; }
.pg-list img, .pg-list .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--line); display: block; }
.pg-list .pos { font: 600 11px var(--font-data); color: var(--muted); text-align: center; }
.pg-list.starters li { padding: 10px 0; }
.pg-list.starters .plink { font-weight: 600; }
.pl-line { font-size: 12px; color: var(--muted); }
.pill.inj-out { color: var(--live); border-color: var(--live); }
.pill.inj-q { color: #b7791f; border-color: #d69e2e; }
@media (max-width: 860px) { .pregame { grid-template-columns: 1fr; } }

/* Estatísticas avançadas */
.adv-table { font-size: 13px; }
.adv-table th.adv-group { text-align: center; font: 700 12px var(--font-data); text-transform: uppercase; letter-spacing: .05em; color: var(--ink); border-bottom: 1px solid var(--line); }
.adv-table thead tr:last-child th { text-align: center; cursor: help; text-decoration: underline dotted color-mix(in srgb, var(--muted) 60%, transparent); text-underline-offset: 3px; }
.adv-table th.adv-corner { background: var(--surface); }
.adv-table td { text-align: center; padding: 10px 12px; min-width: 76px; }
.adv-table tbody th { text-align: left; font: 600 13px var(--font-body); color: var(--ink); text-transform: none; letter-spacing: 0; position: sticky; left: 0; background: var(--surface); }
.adv-table .gsep { border-left: 1px solid var(--line); }
.adv-v { font: 600 17px var(--font-data); font-variant-numeric: tabular-nums; }
.adv-p { font: 600 11px var(--font-data); color: var(--muted); min-height: 14px; }
.adv-p.pc-hi { color: var(--above); } .adv-p.pc-lo { color: var(--below); }
.adv-avg td, .adv-avg th { color: var(--muted) !important; font-weight: 400 !important; font-size: 12px; }
.dfg-table td { text-align: center; padding: 10px 12px; min-width: 110px; }
.dfg-table td b { font-weight: 600; font-size: 15px; }
.dfg-table th[data-tip] { cursor: help; text-decoration: underline dotted color-mix(in srgb, var(--muted) 60%, transparent); text-underline-offset: 3px; text-align: center; }
.dfg-table tbody th { text-align: left; font: 500 13px var(--font-body); color: var(--ink); text-transform: none; letter-spacing: 0; position: sticky; left: 0; background: var(--surface); min-width: 170px; white-space: normal; }
.d-good { color: var(--above); } .d-bad { color: var(--below); }
.dbar { position: relative; height: 4px; margin: 6px auto 0; width: 90px; background: var(--line); border-radius: 2px; }
.dbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.dbar span { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.dbar .neg { right: 50%; background: var(--above); } .dbar .pos { left: 50%; background: var(--below); }
.tip { position: fixed; z-index: 50; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font: 12px/1.45 var(--font-body); pointer-events: none; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }

/* Box scores lado a lado */
.box-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.box-team { min-width: 0; }
.team-title { display: flex; align-items: center; gap: 10px; }
.team-title img { width: 32px; height: 32px; object-fit: contain; flex: none; }
table.box th, table.box td { padding: 7px 7px; }
table.box td { font-size: 12.5px; }
@media (max-width: 900px) { .box-pair { grid-template-columns: 1fr; } }

.livebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border: 1px solid var(--sky); border-radius: 10px; background: color-mix(in srgb, var(--sky) 22%, var(--surface)); text-decoration: none; }

.section { display: grid; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); max-width: 65ch; }
.empty, .error { padding: 28px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.error { border-color: var(--live); color: var(--ink); }
.skeleton { height: 120px; border-radius: 10px; background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

@media (max-width: 560px) {
  .profile { grid-template-columns: 1fr; }
  .board { padding: 16px 10px; }
  .plays li { grid-template-columns: 60px minmax(0, 1fr); }
  .plays .sc { grid-column: 2; }
  nav.tabs { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/jogos">Court<span>side</span></a>
    <nav class="tabs" aria-label="Seções">
      <a href="#/jogos" data-tab="jogos">Jogos</a>
      <a href="#/jogadores" data-tab="jogadores">Jogadores</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" style="padding-top:24px"></main>

<script>
/* ===================== Fonte de dados =====================
   API pública (não oficial) da ESPN. Não exige chave.
   Se um dia parar de funcionar, é aqui que se troca. */
const API = {
  site: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba',
  web:  'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba',
};
const LIVE_REFRESH_MS = 20000;

const app = document.getElementById('app');
let pollTimer = null;
let renderToken = 0;

async function getJSON(url) {
  let r;
  try { r = await fetch(url); }
  catch (e) { throw new Error('O navegador bloqueou ou não alcançou ' + new URL(url).host); }
  if (!r.ok) throw new Error('A API respondeu com erro ' + r.status);
  return r.json();
}
// Tenta vários endereços equivalentes, em ordem, até um responder.
// A ESPN serve o mesmo dado em hosts diferentes, e nem todos liberam acesso pelo navegador.
const HOSTS = ['https://site.api.espn.com', 'https://site.web.api.espn.com'];
async function getAny(path) {
  let last;
  for (const h of HOSTS) {
    try { return await getJSON(h + path); } catch (e) { last = e; }
  }
  throw last;
}
const P = {
  roster: id => `/apis/site/v2/sports/basketball/nba/teams/${id}/roster`,
  athlete: id => `/apis/common/v3/sports/basketball/nba/athletes/${id}`,
  athleteStats: id => `/apis/common/v3/sports/basketball/nba/athletes/${id}/stats`,
  gamelog: id => `/apis/common/v3/sports/basketball/nba/athletes/${id}/gamelog`,
};
// IDs fixos das 30 equipes na ESPN (não mudam), para não depender do endpoint de equipes.
const TEAMS = [
  [1,'ATL','Atlanta Hawks'],[2,'BOS','Boston Celtics'],[17,'BKN','Brooklyn Nets'],[30,'CHA','Charlotte Hornets'],
  [4,'CHI','Chicago Bulls'],[5,'CLE','Cleveland Cavaliers'],[6,'DAL','Dallas Mavericks'],[7,'DEN','Denver Nuggets'],
  [8,'DET','Detroit Pistons'],[9,'GS','Golden State Warriors'],[10,'HOU','Houston Rockets'],[11,'IND','Indiana Pacers'],
  [12,'LAC','LA Clippers'],[13,'LAL','Los Angeles Lakers'],[29,'MEM','Memphis Grizzlies'],[14,'MIA','Miami Heat'],
  [15,'MIL','Milwaukee Bucks'],[16,'MIN','Minnesota Timberwolves'],[3,'NO','New Orleans Pelicans'],[18,'NY','New York Knicks'],
  [25,'OKC','Oklahoma City Thunder'],[19,'ORL','Orlando Magic'],[20,'PHI','Philadelphia 76ers'],[21,'PHX','Phoenix Suns'],
  [22,'POR','Portland Trail Blazers'],[23,'SAC','Sacramento Kings'],[24,'SA','San Antonio Spurs'],[28,'TOR','Toronto Raptors'],
  [26,'UTAH','Utah Jazz'],[27,'WSH','Washington Wizards'],
].map(([id, abbreviation, displayName]) => ({ id: String(id), abbreviation, displayName }));
// Cache simples em memória + sessionStorage (dados que mudam pouco)
const memo = new Map();
async function cached(key, ttlMs, loader) {
  const now = Date.now();
  const m = memo.get(key);
  if (m && now - m.t < ttlMs) return m.v;
  try {
    const s = JSON.parse(sessionStorage.getItem(key) || 'null');
    if (s && now - s.t < ttlMs) { memo.set(key, s); return s.v; }
  } catch (e) {}
  const v = await loader();
  const entry = { t: now, v };
  memo.set(key, entry);
  try { sessionStorage.setItem(key, JSON.stringify(entry)); } catch (e) {}
  return v;
}

/* ===================== Utilidades ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const fromYmd = s => new Date(+s.slice(0,4), +s.slice(4,6) - 1, +s.slice(6,8));
const fmtDay = d => d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
const fmtTime = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const pct = x => (x == null || !isFinite(x)) ? '—' : (x * 100).toFixed(1) + '%';
const toNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
// "8-17" ou "8.2-17.1" -> [8, 17]
const madeAtt = v => { const m = String(v ?? '').match(/^\s*([\d.]+)\s*-\s*([\d.]+)/); return m ? [+m[1], +m[2]] : [null, null]; };
// True Shooting % e Effective FG %
const tsPct = (pts, fga, fta) => (pts == null || fga == null || fta == null || (fga + 0.44 * fta) === 0) ? null : pts / (2 * (fga + 0.44 * fta));
const efgPct = (fgm, tpm, fga) => (fgm == null || tpm == null || !fga) ? null : (fgm + 0.5 * tpm) / fga;
const logoOf = t => t?.logo || t?.logos?.[0]?.href || '';
const stateOf = status => status?.type?.state; // pre | in | post

function setTab(name) {
  document.querySelectorAll('nav.tabs a').forEach(a => {
    if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }
function poll(fn) { stopPolling(); pollTimer = setTimeout(() => { if (!document.hidden) fn(); else poll(fn); }, LIVE_REFRESH_MS); }
function showError(err, retry) {
  app.innerHTML = `<div class="error"><h3>Não foi possível carregar os dados</h3>
    <p class="note" style="margin:8px auto">${esc(err.message || err)}. Verifique sua conexão. Se o erro persistir, a API pode ter mudado ou estar bloqueando o acesso a partir deste endereço.</p>
    <div class="toolbar" style="justify-content:center"><button class="btn primary" id="retry">Tentar de novo</button>
    <a class="btn" href="#/diagnostico" style="text-decoration:none">Rodar diagnóstico</a></div></div>`;
  document.getElementById('retry').onclick = retry;
}
const statusPill = (status) => {
  const st = stateOf(status);
  const label = status?.type?.shortDetail || status?.type?.detail || '';
  if (st === 'in') return `<span class="pill live">${esc(label || 'Ao vivo')}</span>`;
  if (st === 'post') return `<span class="pill">${esc(label || 'Final')}</span>`;
  return `<span class="pill">${esc(label)}</span>`;
};

/* ===================== Página: Jogos do dia ===================== */
/* ===================== Destaques: Clutch Time e duelo de top 4 ===================== */
// Clutch time (definição da NBA): últimos 5 minutos do 4º período ou de uma prorrogação, com diferença de 5 pontos ou menos.
function clockSeconds(status) {
  if (isFinite(status?.clock)) return +status.clock;
  const m = String(status?.displayClock || '').match(/^(\d+):(\d+(?:\.\d+)?)$/);
  return m ? +m[1] * 60 + +m[2] : (/^\d+(\.\d+)?$/.test(status?.displayClock || '') ? +status.displayClock : null);
}
function isClutch(ev) {
  const status = ev.status || ev.competitions?.[0]?.status;
  if (stateOf(status) !== 'in') return false;
  const period = status?.period || 0, secs = clockSeconds(status);
  if (period < 4 || secs == null || secs > 300) return false;
  const sc = (ev.competitions?.[0]?.competitors || []).map(c => +c.score || 0);
  return sc.length === 2 && Math.abs(sc[0] - sc[1]) <= 5;
}
// Top 4 de cada conferência, pela classificação atual da ESPN (cache de 30 min)
async function loadTopSeeds() {
  return cached('nba-top4-v1', 30 * 60e3, async () => {
    const st = await getAny('/apis/v2/sports/basketball/nba/standings');
    const out = {};
    for (const conf of st.children || []) {
      const conf_pt = /east/i.test(conf.name || conf.abbreviation) ? 'Leste' : 'Oeste';
      const stat = (e, n) => { const s = (e.stats || []).find(x => x.name === n || x.type === n); return s ? +s.value : null; };
      const rows = (conf.standings?.entries || []).map(e => ({
        id: String(e.team?.id), seed: stat(e, 'playoffSeed'), pct: stat(e, 'winPercent') ?? 0, gb: stat(e, 'gamesBehind') ?? 99,
      }));
      const hasSeed = rows.every(r => r.seed > 0);
      rows.sort((a, b) => hasSeed ? a.seed - b.seed : b.pct - a.pct || a.gb - b.gb);
      rows.slice(0, 4).forEach((r, i) => { out[r.id] = { seed: i + 1, conf: conf_pt }; });
    }
    if (Object.keys(out).length < 8) throw new Error('classificação incompleta');
    return out;
  });
}
async function viewGames(dateStr, silent) {
  setTab('jogos');
  const token = ++renderToken;
  const date = dateStr ? fromYmd(dateStr) : new Date();
  const key = ymd(date);
  if (!silent) app.innerHTML = gamesShell(date) + `<div class="games">${'<div class="skeleton"></div>'.repeat(6)}</div>`;
  let data;
  const seedsP = loadTopSeeds().catch(() => null);
  try { data = await getJSON(`${API.site}/scoreboard?dates=${key}`); }
  catch (e) { if (token === renderToken) showError(e, () => viewGames(dateStr)); return; }
  if (token !== renderToken) return;

  const seeds = await seedsP;
  if (token !== renderToken) return;
  const events = data.events || [];
  const live = events.filter(e => stateOf(e.status) === 'in').length;
  const isTop4 = ev => !!seeds && (ev.competitions?.[0]?.competitors || []).length === 2
    && ev.competitions[0].competitors.every(c => seeds[String(c.team?.id)]);
  for (const ev of events) { ev._clutch = isClutch(ev); ev._top4 = isTop4(ev); }
  const clutchN = events.filter(e => e._clutch).length, top4N = events.filter(e => e._top4).length;
  // Ordem: em clutch → ao vivo → a seguir → encerrados; dentro de cada grupo, duelos de top 4 primeiro
  const order = { in: 0, pre: 1, post: 2 };
  events.sort((a, b) => (b._clutch - a._clutch) || (order[stateOf(a.status)] ?? 3) - (order[stateOf(b.status)] ?? 3)
    || (b._top4 - a._top4) || new Date(a.date) - new Date(b.date));
  const card = ev => gameCard(ev, seeds);

  app.innerHTML = gamesShell(date, live, events.length) + (events.length
    ? (clutchN || top4N ? `<div class="hl-legend">${clutchN ? `<span class="hl-chip clutch">Clutch time · ${clutchN} jogo${clutchN > 1 ? 's' : ''} agora</span>` : ''}${top4N ? `<span class="hl-chip top4">★ Duelo de top 4 · ${top4N} jogo${top4N > 1 ? 's' : ''}</span>` : ''}</div>` : '')
      + `<div class="games">${events.map(card).join('')}</div>`
    : `<div class="empty">Nenhum jogo nesta data. Use as setas para navegar entre os dias.</div>`)
    + `<p class="note">Horários no seu fuso. ${live ? `Placar atualiza sozinho a cada ${LIVE_REFRESH_MS/1000} s.` : ''} Clique num jogo para ver o box score.</p>
    <p class="note"><b>Clutch time</b>: últimos 5 minutos do 4º período ou da prorrogação, com diferença de até 5 pontos. <b>★ Duelo de top 4</b>: os dois times estão entre os 4 primeiros da sua conferência na classificação atual.${seeds ? '' : ' (A classificação não carregou agora, então os duelos de top 4 não foram marcados.)'}</p>`;
  bindDateNav(date);
  if (live) poll(() => viewGames(dateStr, true)); else stopPolling();
}
function gamesShell(date, live = 0, total = null) {
  const isToday = ymd(date) === ymd(new Date());
  return `<div class="section-head">
    <div><div class="eyebrow">${isToday ? 'Hoje' : 'Rodada'} ${total != null ? `· ${total} jogo${total === 1 ? '' : 's'}` : ''} ${live ? `· <span style="color:var(--sky-text)">${live} ao vivo</span>` : ''}</div>
    <h1>${esc(fmtDay(date))}</h1></div>
    <div class="toolbar">
      <button class="btn" id="prev" aria-label="Dia anterior">←</button>
      <button class="btn" id="today" ${isToday ? 'disabled' : ''}>Hoje</button>
      <button class="btn" id="next" aria-label="Próximo dia">→</button>
      <input type="date" id="pick" value="${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}" aria-label="Escolher data">
    </div></div>`;
}
function bindDateNav(date) {
  const go = d => { location.hash = '#/jogos/' + ymd(d); };
  const shift = n => { const d = new Date(date); d.setDate(d.getDate() + n); go(d); };
  document.getElementById('prev').onclick = () => shift(-1);
  document.getElementById('next').onclick = () => shift(1);
  document.getElementById('today').onclick = () => { location.hash = '#/jogos'; };
  document.getElementById('pick').onchange = e => { if (e.target.value) go(new Date(e.target.value + 'T12:00')); };
}
function gameCard(ev, seeds) {
  const comp = ev.competitions?.[0] || {};
  const st = stateOf(ev.status);
  const cs = [...(comp.competitors || [])].sort(a => a.homeAway === 'away' ? -1 : 1);
  const scores = cs.map(c => +c.score || 0);
  const rows = cs.map((c, i) => {
    const lost = st === 'post' && scores[i] < Math.max(...scores);
    return `<div class="team-row ${lost ? 'lost' : ''}">
      <img src="${esc(logoOf(c.team))}" alt="" loading="lazy">
      <div class="name">${esc(c.team?.displayName)}<span class="rec">${esc(c.records?.[0]?.summary || '')}</span>${ev._top4 && seeds?.[String(c.team?.id)] ? `<span class="seed">${seeds[String(c.team.id)].seed}º ${seeds[String(c.team.id)].conf}</span>` : ''}</div>
      <div class="score">${st === 'pre' ? '' : esc(c.score)}</div></div>`;
  }).join('');
  const tv = comp.broadcasts?.flatMap(b => b.names || []).slice(0, 2).join(', ');
  const right = st === 'pre' ? `<span class="num muted">${fmtTime(ev.date)}</span>` : '';
  const diff = Math.abs(scores[0] - scores[1]);
  const flags = (ev._clutch ? `<div class="flag-clutch"><span class="dot" aria-hidden="true"></span>CLUTCH TIME<span class="flag-sub">${diff === 0 ? 'empatado' : `diferença de ${diff}`}</span></div>` : '')
    + (ev._top4 ? `<div class="flag-top4">★ Duelo de top 4</div>` : '');
  return `<a class="game ${st === 'in' ? 'is-live' : ''} ${ev._clutch ? 'is-clutch' : ''} ${ev._top4 ? 'is-top4' : ''}" href="#/jogo/${esc(ev.id)}">
    ${flags}<div class="game-head">${statusPill(ev.status)}${right}</div>${rows}
    ${tv ? `<div class="eyebrow">TV · ${esc(tv)}</div>` : ''}</a>`;
}

/* ===================== Página: Jogo (box score) ===================== */
async function viewGame(id, silent) {
  setTab('jogos');
  const token = ++renderToken;
  if (!silent) app.innerHTML = `<div class="skeleton" style="height:180px"></div><div class="skeleton" style="height:320px"></div>`;
  let s;
  try { s = await getJSON(`${API.site}/summary?event=${encodeURIComponent(id)}`); }
  catch (e) { if (token === renderToken) showError(e, () => viewGame(id)); return; }
  if (token !== renderToken) return;

  const comp = s.header?.competitions?.[0] || {};
  const status = comp.status;
  const st = stateOf(status);
  const cs = [...(comp.competitors || [])].sort(a => a.homeAway === 'away' ? -1 : 1);
  const side = c => `<div class="side"><img src="${esc(logoOf(c.team))}" alt="">
    <div class="abbr">${esc(c.team?.abbreviation)}</div>
    <div class="pts">${st === 'pre' ? '–' : esc(c.score ?? 0)}</div>
    <div style="font-size:12px;color:#a9a59c">${esc(c.record?.[0]?.summary || c.team?.displayName || '')}</div></div>`;
  const venue = s.gameInfo?.venue?.fullName;

  let html = `<a href="#/jogos" class="plink muted">← Todos os jogos</a>
    <div class="board">${side(cs[0] || {})}
      <div class="mid">${statusPill(status)}
        ${st === 'pre' ? `<div class="clock">${fmtTime(comp.date)}</div>` : ''}
        <div style="font-size:12px;color:#a9a59c">${esc(venue || '')}</div></div>
      ${side(cs[1] || {})}</div>`;

  if (st === 'pre') {
    app.innerHTML = html + `<div class="skeleton" style="height:420px"></div>`;
    html += await pregameSection(s, cs);
    if (token !== renderToken) return;
  } else {
    html += teamCompare(s.boxscore?.teams || [], cs);
    // Elencos (posições específicas PG/SG/SF/PF/C); se demorarem, segue com a posição do box score
    const roster = await Promise.race([loadAllPlayers().catch(() => null), new Promise(r => setTimeout(() => r(null), 2500))]);
    if (token !== renderToken) return;
    const posById = new Map((roster?.players || []).map(x => [String(x.id), x.pos]));
    const order = cs.map(c => String(c.team?.id));

async function injuriesFor(summary, teamIds) {

function timeToReturn(x) {

  const ret = new Date(x.ret.length === 10 ? x.ret + 'T12:00' : x.ret);
  const days = Math.ceil((ret - new Date()) / 864e5);
  if (days <= 2) return /day-to-day/i.test(x.status) ? 'Dia a dia' : 'Retorno iminente';

  }).join('');
  return `<section class="section"><div class="section-head"><h2>Últimas jogadas</h2><span class="eyebrow">Cestas · turnovers · tempos · expulsões</span></div>

    const vals = cat.values || (cat.totals || []).map(toNum);

    },

  s.ts = tsPct(s.pts, s.fga, s.fta);

/* ===================== USG% (Usage Rate) =====================
   Fórmula padrão (Basketball-Reference):
   USG% = 100 × ((FGA + 0,44×FTA + TOV) × (Minutos do time ÷ 5)) ÷ (MIN × (FGA_time + 0,44×FTA_time + TOV_time))
   Com médias por jogo, os minutos do time por jogo são 240 (OT ignorada, diferença de ~1%). */
function usgOf(p, t) {
  if (!p || !t || p.fga == null || p.fta == null || p.to == null || !p.min) return null;
  const den = p.min * (t.fga + 0.44 * t.fta + t.to);
  return den > 0 ? ((p.fga + 0.44 * p.fta + p.to) * 48) / den : null;
}
// Lê as médias por jogo do time de qualquer formato que a ESPN devolver (procura os nomes no JSON inteiro).
function teamAvgsFrom(json) {
  const m = {};
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(walk);
    if (typeof o.name === 'string' && (o.value != null || o.displayValue != null)) {
      const v = o.value != null ? +o.value : toNum(o.displayValue);
      if (m[o.name] == null && isFinite(v)) m[o.name] = v;
    }
    Object.values(o).forEach(walk);
  })(json);
  const gp = m.gamesPlayed || m.games;
  const per = (avg, tot) => m[avg] != null ? m[avg] : (m[tot] != null && gp ? m[tot] / gp : null);
  const t = { fga: per('avgFieldGoalsAttempted', 'fieldGoalsAttempted'), fta: per('avgFreeThrowsAttempted', 'freeThrowsAttempted'), oreb: per('avgOffensiveRebounds', 'offensiveRebounds'),
    dreb: per('avgDefensiveRebounds', 'defensiveRebounds'), fgm: per('avgFieldGoalsMade', 'fieldGoalsMade'), tpa: per('avgThreePointFieldGoalsAttempted', 'threePointFieldGoalsAttempted'),
    to: per('avgTurnovers', 'turnovers') ?? per('avgTotalTurnovers', 'totalTurnovers') };
  return t.fga && t.fta != null && t.to != null ? t : null;
}
// Médias do time numa temporada (season = ano final, ex.: 2027 para 2026-27; vazio = atual)
function loadTeamAvgs(teamId, season) {
  const key = `nba-team-avgs-v2-${teamId}-${season || 'cur'}`;
  return cached(key, season ? 7 * 864e5 : 30 * 60e3, async () => {
    const q = season ? `?season=${season}&seasontype=2` : '';
    return teamAvgsFrom(await getAny(`/apis/site/v2/sports/basketball/nba/teams/${teamId}/statistics${q}`));
  }).catch(() => null);
}
const abbrToId = Object.fromEntries(TEAMS.map(t => [t.abbreviation, t.id]));
// Calcula o USG% da temporada atual para todos os jogadores da lista de estatísticas.
// Se o endpoint de times falhar, soma os próprios jogadores do time como aproximação.
async function addSeasonUsage(stats) {
  if (stats._usgDone) return stats;
  for (const s of stats) { if (s.fgm == null && s.fgPct != null && s.fga != null) s.fgm = s.fgPct * s.fga; }
  for (const s of stats) s.teamId = s.teamId || abbrToId[s.team] || null;
  const ids = [...new Set(stats.map(s => s.teamId).filter(Boolean))];
  const fromApi = Object.fromEntries(await Promise.all(ids.map(async id => [id, await loadTeamAvgs(id)])));
  for (const id of ids) {
    if (fromApi[id]) continue;
    const ps = stats.filter(s => s.teamId === id && s.gp);
    const g = Math.max(0, ...ps.map(s => s.gp));
    if (!g) continue;
    const sum = k => ps.reduce((t, s) => t + (s[k] || 0) * s.gp, 0) / g;
    fromApi[id] = { fga: sum('fga'), fta: sum('fta'), to: sum('to'), oreb: sum('oreb'), dreb: sum('dreb'), fgm: sum('fgm'), tpa: sum('tpa'), approx: true };
  }
  for (const s of stats) {
    const t = fromApi[s.teamId];
    s.usg = usgOf(s, t);
    // Posses do time por jogo: FGA + 0,44×FTA − OREB + TOV
    s.tposs = t ? t.fga + 0.44 * t.fta - (t.oreb || 0) + t.to : null;
    s.tm = t || null;
  }
  // Média de um time da liga: usada como "adversário médio" nas fórmulas que pedem dados do oponente
  const ts = Object.values(fromApi).filter(Boolean);
  const avgK = k => { const v = ts.map(t => t[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  stats.leagueTeam = { fga: avgK('fga'), fta: avgK('fta'), to: avgK('to'), oreb: avgK('oreb'), dreb: avgK('dreb'), fgm: avgK('fgm'), tpa: avgK('tpa') };
  stats._usgDone = true;
  return stats;
}
// USG% de carreira: calcula temporada a temporada (com os números do time de cada ano) e faz a média ponderada pelos minutos.
async function careerUsage(statsJson) {
  const cats = statsJson?.categories || [];
  const avg = cats.find(c => /average/i.test(c.name || c.displayName)) || cats[0];
  const labels = avg?.labels || avg?.names || [];
  const ix = l => labels.indexOf(l);
  const rows = (avg?.statistics || []).filter(r => r.teamId && r.season?.year);
  const parts = await Promise.all(rows.map(async r => {
    const v = r.stats || [];
    const [, fga] = madeAtt(v[ix('FG')]); const [, fta] = madeAtt(v[ix('FT')]);
    const p = { fga, fta, to: toNum(v[ix('TO')]), min: toNum(v[ix('MIN')]) };
    const gp = toNum(v[ix('GP')]) || 0;
    const t = await loadTeamAvgs(r.teamId, r.season.year);
    const u = usgOf(p, t);
    return u == null ? null : { u, w: (p.min || 0) * gp };
  }));
  const ok = parts.filter(Boolean);
  const W = ok.reduce((t, x) => t + x.w, 0);
  return W ? ok.reduce((t, x) => t + x.u * x.w, 0) / W : null;
}

  { k: 'pra',   l: 'P+R+A', t: 'Pontos + rebotes + assistências', f: 1 , count: true },
];
const colByKey = Object.fromEntries(COLS.map(c => [c.k, c]));
/* Per Mode (como no site da NBA): por jogo, totais, por 36 ou 48 minutos e por 100 posses.
   Porcentagens, jogos e USG% não mudam com o modo. */
const PER_MODES = [
  { k: 'jogo',  l: 'Por jogo' },
  { k: 'total', l: 'Totais' },
  { k: 'p36',   l: 'Por 36 min' },
  { k: 'p48',   l: 'Por 48 min' },
  { k: 'p100',  l: 'Por 100 posses' },
];
function modeValue(p, c, mode) {
  const v = p[c.k];
  if (!c.count || v == null || mode === 'jogo') return v;
  if (mode === 'total') {
    if (c.k === 'pra') { const a = ['pts', 'reb', 'ast'].map(k => modeValue(p, colByKey[k], 'total')); return a.some(x => x == null) ? null : a[0] + a[1] + a[2]; }
    return p.tot?.[c.k] ?? (p.gp != null ? v * p.gp : null);
  }
  if (c.k === 'min') return v; // nos modos de taxa, MIN continua sendo minutos por jogo
  if (!p.min) return null;
  if (mode === 'p36') return v * 36 / p.min;
  if (mode === 'p48') return v * 48 / p.min;
  if (mode === 'p100') { const poss = p.tposs ? p.tposs * p.min / 48 : null; return poss ? v * 100 / poss : null; }
  return v;
}

const fmtStat = (c, v) => v == null ? '—' : c.p ? (v * 100).toFixed(1).replace('.', ',') + '%' : v.toFixed(c.f).replace('.', ',');

const ptSeason = s => String(s || '')
  .replace(/Regular Season/i, 'Temporada regular').replace(/Postseason/i, 'Playoffs')
  .replace(/Preseason/i, 'Pré-temporada').replace(/Play-?In/i, 'Play-in');
function parseGamelog(g) {
  if (!g) return null;
  const labels = g.labels || g.names || [];
  const meta = g.events || {};
  const groups = [];
  for (const st of g.seasonTypes || []) {
    const rows = [];
    for (const cat of st.categories || []) {
      if (cat.type && cat.type !== 'event') continue;
      for (const e of cat.events || []) {
        const id = String(e.eventId ?? e.id);
        const m = meta[id] || {};
        rows.push({ id, stats: e.stats || [], date: m.gameDate, atVs: m.atVs || '', opp: m.opponent || {},
          res: m.gameResult || '', score: m.score || '' });
      }
    }
    rows.sort((x, y) => new Date(y.date) - new Date(x.date));
    if (rows.length) groups.push({ name: ptSeason(st.displayName), pre: /pre/i.test(st.displayName || ''), rows });
  }
  return { labels, groups };
}

/* ===================== Mapa de arremessos =====================
   Sistema de coordenadas do mapa, em pés: x de 0 a 50 (largura da quadra),
   y de 0 (linha de fundo) a 47 (meio da quadra). Aro em (25, 5,25). */
const RIM_Y = 5.25;
const ZONES = {
  ra:    { name: 'Área restrita',                lg: .655, at: [25, 9.1] },
  paint: { name: 'Garrafão (fora da área restrita)', lg: .435, at: [25, 15.6] },
  mid_l: { name: 'Meia distância · esquerda',    lg: .415, at: [10, 9] },
  mid_c: { name: 'Meia distância · centro',      lg: .415, at: [25, 24] },
  mid_r: { name: 'Meia distância · direita',     lg: .415, at: [40, 9] },
  c3_l:  { name: 'Bola de 3 · canto esquerdo',   lg: .385, at: [1.6, 6] },
  c3_r:  { name: 'Bola de 3 · canto direito',    lg: .385, at: [48.4, 6] },
  atb_l: { name: 'Bola de 3 · ala esquerda',     lg: .355, at: [6.5, 26] },
  atb_c: { name: 'Bola de 3 · topo',             lg: .355, at: [25, 36] },
  atb_r: { name: 'Bola de 3 · ala direita',      lg: .355, at: [43.5, 26] },
};
const ZONE_ORDER = ['ra', 'paint', 'mid_l', 'mid_c', 'mid_r', 'c3_l', 'c3_r', 'atb_l', 'atb_c', 'atb_r'];
const angleOf = (dx, yb) => Math.atan2(dx, yb - RIM_Y) * 180 / Math.PI;
const midBy = (dx, yb) => yb < 19 ? (dx < 0 ? 'mid_l' : 'mid_r') : (Math.abs(angleOf(dx, yb)) < 25 ? 'mid_c' : dx < 0 ? 'mid_l' : 'mid_r');
const atbBy = (dx, yb) => { const a = angleOf(dx, yb); return a < -30 ? 'atb_l' : a > 30 ? 'atb_r' : 'atb_c'; };
function zoneOf(dx, yb) {
  const d = Math.hypot(dx, yb - RIM_Y);
  const is3 = Math.abs(dx) >= 22 || d >= 23.75;
  if (!is3) {
    if (d < 4) return 'ra';
    if (Math.abs(dx) < 8 && yb < 19) return 'paint';
    return midBy(dx, yb);
  }
  if (Math.abs(dx) >= 22 && yb <= 14.2) return dx < 0 ? 'c3_l' : 'c3_r';
  return atbBy(dx, yb);
}
// Zona final do arremesso: usa a posição, mas respeita se a jogada foi registrada como bola de 3 ou de 2.
function shotZone(s) {
  if (!s.ok) return (!s.t3 && s.d != null && s.d < 4) ? 'ra' : null;
  let z = zoneOf(s.dx, s.yb);
  const geo3 = z.startsWith('c3') || z.startsWith('atb');
  if (s.t3 && !geo3) z = (Math.abs(s.dx) >= 19 && s.yb <= 15) ? (s.dx < 0 ? 'c3_l' : 'c3_r') : atbBy(s.dx, s.yb);
  if (!s.t3 && geo3) z = (s.yb - RIM_Y < 4 && Math.abs(s.dx) < 4) ? 'ra' : midBy(s.dx, s.yb);
  return z;
}
const median = arr => { const v = [...arr].sort((a, b) => a - b); const n = v.length; return n ? (n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2) : null; };

// Lê o play-by-play de um jogo e devolve só os arremessos do jogador, já convertidos para o mapa.
// A ESPN não documenta a escala das coordenadas, então o código se calibra com os dados do próprio jogo:
// o aro é estimado pela posição das bandejas e enterradas, e a escala pela distância escrita na jogada ("26-foot").
function extractShots(summary, pid) {
  const txt = p => (p.type?.text || '') + ' ' + (p.text || '');
  const plays = (summary.plays || []).filter(p => p.shootingPlay && !/free throw/i.test(txt(p)));
  const valid = p => { const c = p.coordinate; return c && isFinite(c.x) && isFinite(c.y) && Math.abs(c.x) < 1e5 && Math.abs(c.y) < 1e5; };
  const distOf = p => { const m = (p.text || '').match(/(\d+)-(?:foot|ft)/i); return m ? +m[1] : null; };
  const isRim = p => { const d = distOf(p); return (d != null && d <= 1) || /dunk|layup|tip|alley/i.test(txt(p)); };

  const cands = plays.filter(p => valid(p) && isRim(p)).map(p => p.coordinate);
  let rims = [];
  if (cands.length >= 4) {
    const ys = cands.map(c => c.y).sort((a, b) => a - b);
    if (ys[ys.length - 1] - ys[0] > 30) { // quadra inteira: um aro em cada ponta
      const mid = (ys[0] + ys[ys.length - 1]) / 2;
      for (const G of [cands.filter(c => c.y < mid), cands.filter(c => c.y >= mid)])
        if (G.length) rims.push({ x: median(G.map(c => c.x)), y: median(G.map(c => c.y)) });
    } else rims.push({ x: median(cands.map(c => c.x)), y: median(cands.map(c => c.y)) });
  } else rims.push({ x: 25, y: RIM_Y });
  const nearest = c => rims.reduce((b, r) => Math.hypot(c.x - r.x, c.y - r.y) < Math.hypot(c.x - b.x, c.y - b.y) ? r : b, rims[0]);
  const ratios = plays.filter(p => valid(p) && (distOf(p) ?? 0) >= 8).map(p => {
    const r = nearest(p.coordinate); return Math.hypot(p.coordinate.x - r.x, p.coordinate.y - r.y) / distOf(p);
  });
  let scale = ratios.length >= 4 ? median(ratios) : 1;
  if (!(scale > 0.05 && scale < 50)) scale = 1;
  // Orientação: para que lado a quadra "cresce" a partir de cada aro (usa só arremessos longe do aro)
  for (const r of rims) {
    const ys = plays.filter(valid).filter(p => nearest(p.coordinate) === r)
      .filter(p => Math.hypot(p.coordinate.x - r.x, p.coordinate.y - r.y) > 4 * scale).map(p => p.coordinate.y - r.y);
    r.sign = (median(ys) ?? 1) < 0 ? -1 : 1;
  }

  return plays.filter(p => String(p.participants?.[0]?.athlete?.id) === String(pid)).map(p => {
    const t3 = /three point|3-pt|3pt/i.test(txt(p)) || p.pointsAttempted === 3 || (p.scoringPlay && p.scoreValue === 3) ? 1 : 0;
    const base = { m: p.scoringPlay ? 1 : 0, t3, d: distOf(p) };
    if (!valid(p)) return { ...base, ok: 0 };
    const r = nearest(p.coordinate);
    const dx = (p.coordinate.x - r.x) * r.sign / scale;
    const dy = (p.coordinate.y - r.y) * r.sign / scale;
    return { ...base, ok: 1, dx: +dx.toFixed(2), yb: +Math.max(0.3, RIM_Y + dy).toFixed(2) };
  });
}
async function loadGameShots(eventId, pid) {
  const key = `shots-v1-${eventId}-${pid}`;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}
  const s = await getJSON(`${API.site}/summary?event=${encodeURIComponent(eventId)}`);
  const shots = extractShots(s, pid);
  if (stateOf(s.header?.competitions?.[0]?.status) === 'post') {
    try { localStorage.setItem(key, JSON.stringify(shots)); } catch (e) {}
  }
  return shots;
}

async function initShots(pid, gl, token) {
  const sel = document.getElementById('shot-scope');
  const sum = document.getElementById('shot-sum');
  const load = document.getElementById('shot-load');
  const dotsBox = document.getElementById('shot-dots');
  if (!sel) return;
  const all = gl ? gl.groups.flatMap(g => g.rows.map(r => ({ ...r, pre: g.pre }))) : [];
  if (!all.length) {
    sel.innerHTML = '<option>Sem jogos</option>'; sel.disabled = true;
    sum.innerHTML = `<span class="muted">${gl ? 'Nenhum jogo nesta temporada ainda.' : 'Não foi possível carregar os jogos da temporada.'}</span>`;
    drawShots([], 0);
    return;
  }
  const regular = all.filter(r => !r.pre);
  const seasonGames = regular.length ? regular : all;
  const dfmt = d => d ? new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : '';
  sel.innerHTML = `<option value="season">Temporada inteira (${seasonGames.length} jogos)</option>
    <option value="last5">Últimos 5 jogos</option>` +
    all.map(r => `<option value="${esc(r.id)}">${dfmt(r.date)} · ${r.atVs === '@' ? '@' : 'vs'} ${esc(r.opp.abbreviation || '')}${r.pre ? ' (pré)' : ''}</option>`).join('');

  const byGame = new Map(), failed = new Set();
  const idsFor = v => v === 'season' ? seasonGames.map(r => r.id) : v === 'last5' ? seasonGames.slice(0, 5).map(r => r.id) : [v];
  let raf = 0;
  const render = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (token !== renderToken) return;
      const ids = idsFor(sel.value);
      const shots = ids.flatMap(id => byGame.get(id) || []);
      const done = ids.filter(id => byGame.has(id) || failed.has(id)).length;
      load.hidden = done >= ids.length;
      load.textContent = `Lendo play-by-play… ${done} de ${ids.length} jogos`;
      drawShots(shots, ids.length, failed.size ? ids.filter(id => failed.has(id)).length : 0);
    });
  };
  const queue = [];
  const fetchGame = id => {
    if (byGame.has(id) || failed.has(id) || queue.includes(id)) return;
    queue.push(id);
  };
  let running = 0;
  const pump = () => {
    while (running < 4 && queue.length) {
      const id = queue.shift(); running++;
      loadGameShots(id, pid)
        .then(s => byGame.set(id, s)).catch(() => failed.add(id))
        .finally(() => { running--; if (token === renderToken) { render(); pump(); } });
    }
  };
  const ensure = () => { idsFor(sel.value).forEach(fetchGame); pump(); render(); };

  sel.onchange = ensure;
  dotsBox.onchange = render;
  app.querySelectorAll('[data-shots]').forEach(b => b.onclick = () => {
    sel.value = b.dataset.shots; ensure();
    document.getElementById('shots').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  const mq = matchMedia('(prefers-color-scheme: dark)');
  mq.onchange = () => { if (token === renderToken) render(); };
  ensure();
}

function zoneStats(shots) {
  const z = Object.fromEntries(ZONE_ORDER.map(k => [k, { m: 0, a: 0 }]));
  let unk = 0;
  for (const s of shots) { const k = shotZone(s); if (!k) { unk++; continue; } z[k].a++; z[k].m += s.m; }
  return { z, unk };
}
function hexRgb(h) {
  h = h.trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function zoneColor(st, lg, cs) {
  const surf = hexRgb(cs.getPropertyValue('--court'));
  if (!st.a) return surf;
  const diff = st.m / st.a - lg;
  let target, t;
  if (Math.abs(diff) < 0.03) { target = hexRgb(cs.getPropertyValue('--line')); t = 0.75; }
  else { target = hexRgb(cs.getPropertyValue(diff > 0 ? '--above' : '--below')); t = 0.22 + 0.5 * Math.min(1, Math.abs(diff) / 0.15); }
  if (st.a < 3) t *= 0.5; // amostra pequena: cor mais fraca
  return surf.map((c, i) => Math.round(c + (target[i] - c) * t));
}
function drawShots(shots, nGames, nFailed = 0) {
  const court = document.getElementById('court');
  if (!court) return;
  const cs = getComputedStyle(document.documentElement);
  const { z, unk } = zoneStats(shots);

  // 1) Zonas coloridas (canvas, pixel a pixel)
  const cv = court.querySelector('canvas');
  const S = 16; // pixels por pé
  cv.width = 50 * S; cv.height = 47 * S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(cv.width, cv.height);
  const colors = Object.fromEntries(ZONE_ORDER.map(k => [k, zoneColor(z[k], ZONES[k].lg, cs)]));
  for (let py = 0; py < cv.height; py++) {
    const yb = (py + 0.5) / S;
    for (let px = 0; px < cv.width; px++) {
      const c = colors[zoneOf((px + 0.5) / S - 25, yb)];
      const o = (py * cv.width + px) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // 2) Linhas da quadra, arremessos e rótulos (SVG por cima)
  const ln = 'fill="none" stroke="var(--muted)" stroke-width=".18" opacity=".8"';
  let g = `<rect x="0.1" y="0.1" width="49.8" height="46.8" ${ln}/>
    <rect x="17" y="0" width="16" height="19" ${ln}/><circle cx="25" cy="19" r="6" ${ln}/>
    <line x1="22" y1="4" x2="28" y2="4" stroke="var(--ink)" stroke-width=".25"/><circle cx="25" cy="${RIM_Y}" r=".75" fill="none" stroke="var(--ink)" stroke-width=".2"/>
    <path d="M21 ${RIM_Y} A4 4 0 0 0 29 ${RIM_Y}" ${ln}/>
    <path d="M3 0 L3 14.2 A23.75 23.75 0 0 0 47 14.2 L47 0" fill="none" stroke="var(--ink)" stroke-width=".22"/>
    <path d="M19 47 A6 6 0 0 1 31 47" ${ln}/>`;
  if (document.getElementById('shot-dots')?.checked) {
    for (const s of shots) {
      if (!s.ok) continue;
      const x = Math.min(49.6, Math.max(0.4, 25 + s.dx)), y = Math.min(46.6, Math.max(0.4, s.yb));
      g += s.m
        ? `<circle cx="${x}" cy="${y}" r=".42" fill="var(--good)" stroke="var(--court)" stroke-width=".1"/>`
        : `<path d="M${x - .32} ${y - .32}L${x + .32} ${y + .32}M${x + .32} ${y - .32}L${x - .32} ${y + .32}" stroke="var(--muted)" stroke-width=".16" opacity=".85"/>`;
    }
  }
  for (const k of ZONE_ORDER) {
    const st = z[k], [x, y] = ZONES[k].at;
    const small = k.startsWith('c3');
    const fs = small ? 1.15 : 1.45;
    g += `<text class="zone-lbl" x="${x}" y="${y}" font-size="${fs}" font-weight="600">${st.m}/${st.a}</text>
      <text class="zone-lbl" x="${x}" y="${y + fs * 1.05}" font-size="${fs * 0.85}">${st.a ? (st.m / st.a * 100).toFixed(0) + '%' : '–'}</text>`;
  }
  court.querySelector('svg').innerHTML = g;

  // 3) Tabela de zonas e resumo
  const fmtP = (m, a) => a ? (m / a * 100).toFixed(1).replace('.', ',') + '%' : '—';
  document.getElementById('zone-rows').innerHTML = ZONE_ORDER.map(k => {
    const st = z[k], lg = ZONES[k].lg;
    const diff = st.a ? st.m / st.a - lg : null;
    const cls = diff == null || Math.abs(diff) < 0.03 ? '' : diff > 0 ? 'diff-pos' : 'diff-neg';
    return `<tr><td>${ZONES[k].name}</td><td>${st.m}/${st.a}</td><td class="${cls}">${fmtP(st.m, st.a)}</td><td class="muted">${(lg * 100).toFixed(0)}%</td></tr>`;
  }).join('');
  const fga = shots.length, fgm = shots.reduce((t, s) => t + s.m, 0);
  const t3a = shots.filter(s => s.t3).length, t3m = shots.filter(s => s.t3 && s.m).length;
  const efg = fga ? (fgm + 0.5 * t3m) / fga : null;
  document.getElementById('shot-sum').innerHTML = fga
    ? `<span>Arremessos de quadra <b>${fgm}/${fga}</b> (${fmtP(fgm, fga)})</span><span>Bolas de 3 <b>${t3m}/${t3a}</b> (${fmtP(t3m, t3a)})</span><span>eFG% <b>${pct(efg).replace('.', ',')}</b></span>`
      + (unk ? `<span class="muted">${unk} sem localização</span>` : '') + (nFailed ? `<span class="muted">${nFailed} jogo(s) não carregaram</span>` : '')
    : `<span class="muted">${nGames ? 'Nenhum arremesso registrado neste período.' : ''}</span>`;
}

// Médias de carreira a partir do endpoint de estatísticas do atleta (linha "totals" das médias)
function careerFromStats(data) {
  const cats = data?.categories || [];
  const avg = cats.find(c => /average/i.test(c.name || c.displayName)) || cats[0];
  const t = avg?.totals;
  if (!t?.length) return null;
  const labels = avg.labels || avg.names || [];
  const get = (...ls) => { for (const l of ls) { const i = labels.indexOf(l); if (i >= 0 && t[i] != null && t[i] !== '') return t[i]; } return null; };
  const n = v => toNum(v);
  const p = v => { const x = toNum(v); return x == null ? null : x > 1 ? x / 100 : x; };
  const [fgm, fga] = madeAtt(get('FG')); const [tpm, tpa] = madeAtt(get('3PT', '3P')); const [, fta] = madeAtt(get('FT'));
  const s = {
    seasons: new Set((avg.statistics || []).map(r => r.season?.displayName || r.season?.year)).size || null,
    gp: n(get('GP')), min: n(get('MIN')), pts: n(get('PTS')), reb: n(get('REB')), ast: n(get('AST')),
    stl: n(get('STL')), blk: n(get('BLK')), to: n(get('TO')),
    fgPct: p(get('FG%')), tpm, tpa, tpPct: p(get('3P%')), ftPct: p(get('FT%')), fga, fgm, fta,
  };
  s.ts = tsPct(s.pts, fga, fta);
  s.pra = s.pts != null && s.reb != null && s.ast != null ? s.pts + s.reb + s.ast : null;
  return s;
}
const careerCache = new Map();
function loadCareer(id) {
  if (!careerCache.has(id)) careerCache.set(id, getAny(P.athleteStats(encodeURIComponent(id))).then(async j => {
    const c = careerFromStats(j); if (c) c.usg = await careerUsage(j); return c;
  }).catch(e => { careerCache.delete(id); throw e; }));
  return careerCache.get(id);
}

  await Promise.all(ids.map(async id => {

    if (r) { meta[id] = { name: r.name, img: r.img, team: r.team, pos: r.pos }; return; }
    try { const a = (await getAny(P.athlete(encodeURIComponent(id)))).athlete; meta[id] = { name: a.displayName, img: a.headshot?.href, team: a.team?.abbreviation || '', pos: a.position?.abbreviation || '' }; }
    catch (e) { meta[id] = { name: 'Jogador ' + id, img: '', team: '', pos: '' }; }
  }));
  if (token !== renderToken) return;

  // Números conforme o modo
  let values = {}, missing = [];
  if (mode === 'temporada') {
    for (const id of ids) { values[id] = seasonById.get(id) || null; if (!values[id]) missing.push(id); }
  } else {
    const res = await Promise.allSettled(ids.map(loadCareer));
    if (token !== renderToken) return;
    ids.forEach((id, i) => { values[id] = res[i].status === 'fulfilled' ? res[i].value : null; if (!values[id]) missing.push(id); });
  }

  const rows = CMP_ROWS.filter(r => !r.only || r.only === mode);
  const wins = Object.fromEntries(ids.map(id => [id, 0]));
  let contested = 0;

    if (!r.better || ids.length < 2) return new Set();
    const vals = ids.map(id => values[id]?.[r.k]).filter(v => v != null);
    if (vals.length < 2) return new Set();
    const target = r.better === 'high' ? Math.max(...vals) : Math.min(...vals);
    if (vals.every(v => v === target)) return new Set();
    contested++;
    const win = new Set(ids.filter(id => values[id]?.[r.k] === target));
    win.forEach(id => wins[id]++);
    return win;
  };
  const fmt = (r, v) => v == null ? '—' : r.p ? (v * 100).toFixed(1).replace('.', ',') + '%' : v.toFixed(r.f).replace('.', ',');
  const body = rows.map(r => {

  }).join('');

  const head = ids.map(id => {

  }).join('');

  app.innerHTML = `<a href="${ids[0] ? '#/jogador/' + esc(ids[0]) : '#/jogadores'}" class="plink muted">← Voltar</a>
    <div class="section-head"><div><div class="eyebrow">${ids.length} de ${CMP_MAX} jogadores</div><h1>Comparar jogadores</h1></div>
      <div class="seg" role="tablist" aria-label="Período">
        <a href="#/comparar/${ids.join(',')}" role="tab" aria-selected="${mode === 'temporada'}">Esta temporada</a>
        <a href="#/comparar/${ids.join(',')}/carreira" role="tab" aria-selected="${mode === 'carreira'}">Carreira</a></div></div>
    <div class="cmp-add">
      ${ids.length < CMP_MAX ? `<input type="search" id="cmp-q" placeholder="Adicionar jogador à comparação…" autocomplete="off" aria-label="Buscar jogador para adicionar">
        <div class="cmp-results" id="cmp-res" hidden></div>` : `<p class="note" style="margin:0">Limite de ${CMP_MAX} jogadores atingido. Remova um para adicionar outro.</p>`}
    </div>
    ${ids.length ? `<div class="table-wrap"><table class="cmp-table"><thead><tr><th class="cmp-stat">${mode === 'carreira' ? 'Médias de carreira<br><span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">temporada regular</span>' : 'Médias da temporada'}</th>${head}</tr></thead>
      <tbody>${body}</tbody></table></div>
      <p class="note">Em verde, o melhor valor de cada linha. "X de Y" abaixo do nome conta em quantas categorias o jogador foi o melhor.${ids.length < 2 ? ' Adicione pelo menos mais um jogador para ver os destaques.' : ''}
      ${missing.length ? `<br>${missing.map(id => esc(meta[id].name)).join(', ')}: sem ${mode === 'carreira' ? 'estatísticas de carreira' : 'jogos nesta temporada'}.` : ''}</p>`
      : `<div class="empty">Busque um jogador acima para começar a comparação.</div>`}`;

  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => go(ids.filter(x => x !== b.dataset.rm)));
  const q = document.getElementById('cmp-q'), res = document.getElementById('cmp-res');
  if (q) {
    const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    let hits = [];
    q.oninput = () => {
      const t = norm(q.value.trim());
      hits = t.length < 2 ? [] : searchable.filter(p => !ids.includes(p.id) && norm(p.name).includes(t)).slice(0, 8);
      res.hidden = !hits.length && t.length < 2;
      res.innerHTML = hits.length ? hits.map(p => `<button type="button" data-add="${esc(p.id)}">${p.img ? `<img src="${esc(p.img)}" alt="">` : '<span class="avatar"></span>'}
          <span>${esc(p.name)}</span><span class="muted num" style="font-size:12px">${esc(p.team || '')}</span></button>`).join('')
        : `<div class="muted" style="padding:10px 12px">Nenhum jogador encontrado.</div>`;
      res.querySelectorAll('[data-add]').forEach(b => b.onclick = () => go([...ids, b.dataset.add]));
    };
    q.onkeydown = e => { if (e.key === 'Enter' && hits[0]) go([...ids, hits[0].id]); if (e.key === 'Escape') { q.value = ''; res.hidden = true; } };
    if (ids.length) q.focus({ preventScroll: true });

/* ===================== Estatísticas avançadas (temporada atual) =====================
   Fórmulas no padrão Basketball-Reference, com médias por jogo. Onde a fórmula pede números do
   adversário (que a ESPN não fornece por jogador), usa-se o time médio da liga. */
// Dados de "hustle" do rastreamento óptico da NBA (contestações, deflexões), espelhados diariamente
// no repositório público gabriel1200/site_data. Os IDs são da NBA.com, então o cruzamento com a ESPN é pelo nome.
const HUSTLE_URL = 'https://raw.githubusercontent.com/gabriel1200/site_data/master/hustle.csv';
const normName = n => String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[.'’]/g, '').replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
async function loadHustle() {
  return cached('nba-hustle-v1', 6 * 3600e3, async () => {
    let r;
    try { r = await fetch(HUSTLE_URL); } catch (e) { throw new Error('O navegador não alcançou raw.githubusercontent.com'); }
    if (!r.ok) throw new Error('Fonte de contestações respondeu ' + r.status);
    const lines = (await r.text()).trim().split(/\r?\n/);
    const head = lines.shift().split(',');
    const ix = k => head.indexOf(k);
    const iy = ix('year'), rows = lines.map(l => l.split(','));
    const year = Math.max(...rows.map(c => +c[iy]).filter(isFinite));
    const num = (c, k) => { const v = parseFloat(c[ix(k)]); return isFinite(v) ? v : null; };
    return { year, rows: rows.filter(c => +c[iy] === year).map(c => ({
      key: normName(c[ix('PLAYER_NAME')]), team: c[ix('TEAM_ABBREVIATION')], g: num(c, 'G'), min: num(c, 'MIN'),
      cs: num(c, 'CONTESTED_SHOTS'), cs2: num(c, 'CONTESTED_SHOTS_2PT'), cs3: num(c, 'CONTESTED_SHOTS_3PT'), defl: num(c, 'DEFLECTIONS'),
    })) };
  });
}
function hustleRates(h) {
  if (!h || !h.g) return null;
  const pg = v => v == null ? null : v / h.g;
  return { cpg: pg(h.cs), c2pg: pg(h.cs2), c3pg: pg(h.cs3), c36: h.min ? h.cs * 36 / h.min : null,
    c3share: h.cs ? h.cs3 / h.cs : null, deflpg: pg(h.defl), _g: h.g, _mpg: h.min / h.g };
}
// Aproveitamento defendido (DFG% vs FG% normal), gerado todo dia pela automação do GitHub

function dfgPanel(def, me) {
  const head = `<div class="section-head" style="margin-top:8px"><div><h3>Aproveitamento dos adversários contra ele</h3>
    <div class="eyebrow" style="margin-top:4px">Quando ele é o defensor mais próximo · rastreamento NBA.com</div></div></div>`;
  if (!def || def.error) return head + `<div class="empty">Dados ainda não disponíveis: ${esc(def?.error?.message || 'sem arquivo')}.</div>`;
  if (!def.players?.length) return head + `<div class="empty">A automação diária ainda não rodou. Assim que rodar, os números aparecem aqui.</div>`;
  const key = normName(me.name);
  const p = def.players.find(x => normName(x.name) === key);
  if (!p) return head + `<div class="empty">Jogador não encontrado nos dados de defesa da NBA.com desta temporada.</div>`;
  const maxG = Math.max(1, ...def.players.map(x => x.g || 0));
  const rows = DFG_CATS.map(c => {
    const v = p.c?.[c.k];
    if (!v || !v[1]) return `<tr><th scope="row">${c.l}</th><td colspan="5" class="muted" style="text-align:center">sem arremessos defendidos</td></tr>`;
    const [m, a, pct, norm, diff] = v;
    // Percentil da diferença entre jogadores com volume parecido (menor diferença = melhor defesa)
    const pool = def.players.filter(x => (x.g || 0) >= Math.ceil(maxG / 2) && x.c?.[c.k] && x.c[c.k][1] / x.g >= c.min).map(x => x.c[c.k][4]);
    const pc = pool.length >= 10 ? Math.round(100 * (pool.filter(d => d > diff).length + pool.filter(d => d === diff).length / 2) / pool.length) : null;
    const pp = x => (x * 100).toFixed(1).replace('.', ',');
    const dCls = diff <= -0.02 ? 'd-good' : diff >= 0.02 ? 'd-bad' : '';
    const w = Math.min(100, Math.abs(diff) / 0.12 * 100);
    return `<tr><th scope="row">${c.l}</th>
      <td>${(a / p.g).toFixed(1).replace('.', ',')}<div class="adv-p">${m}/${a} no total</div></td>
      <td><b>${pp(pct)}%</b></td><td>${pp(norm)}%</td>
      <td class="${dCls}"><b>${diff > 0 ? '+' : ''}${pp(diff)}</b> p.p.
        <div class="dbar" aria-hidden="true"><span class="${diff < 0 ? 'neg' : 'pos'}" style="width:${w / 2}%"></span></div></td>
      <td><span class="adv-p ${pc == null ? '' : pc >= 67 ? 'pc-hi' : pc <= 33 ? 'pc-lo' : ''}" style="font-size:13px">${pc ?? '—'}</span></td></tr>`;
  }).join('');
  const upd = def.updated ? new Date(def.updated).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  return head + `<div class="table-wrap"><table class="dfg-table"><thead><tr><th>Tipo de arremesso</th>
      <th data-tip="Arremessos por jogo em que ele era o defensor mais próximo do arremessador.">Defendidos/J</th>
      <th data-tip="Aproveitamento dos adversários nesses arremessos, com ele marcando.">Acerto contra ele</th>
      <th data-tip="Quanto esses mesmos arremessadores acertam normalmente nesse tipo de arremesso, na temporada.">Acerto normal deles</th>
      <th data-tip="Diferença em pontos percentuais. Negativo (azul) = os adversários acertam menos que o normal quando ele marca; positivo (vermelho) = acertam mais.">Diferença</th>
      <th data-tip="Percentil da diferença entre jogadores com volume parecido. 90 = defende melhor que 90% deles nesse tipo de arremesso.">Percentil</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="note">Exemplo de leitura: "−6,0 p.p." significa que, com ele marcando, os adversários acertam 6 pontos percentuais a menos do que costumam acertar. Dados de ${esc(def.season || '')}, atualizados em ${upd}.</p>`;
}
async function prepareSeason() {
  const [stats, roster] = await Promise.all([loadLeagueStats(), loadAllPlayers().catch(() => ({ players: [] }))]);
  if (!stats._usgDone) {
    const byId = new Map(roster.players.map(p => [p.id, p]));
    for (const s of stats) { const r = byId.get(s.id); if (r) { s.team = r.team || s.team; s.teamId = r.teamId || s.teamId; } }
  }
  await addSeasonUsage(stats);
  return stats;
}
function computeAdvanced(s, L) {
  if (!s || !s.min) return null;
  const t = s.tm, m = s.min;
  const per36 = v => v == null ? null : v * 36 / m;
  const div = (a, b) => (a == null || b == null || !(b > 0)) ? null : a / b;
  const ftm = s.ftPct != null && s.fta != null ? s.ftPct * s.fta : null;
  return {
    ts: s.ts, efg: efgPct(s.fgm, s.tpm, s.fga), usg: s.usg,
    pts100: s.tposs ? div(s.pts * 100, s.tposs * m / 48) : null,
    pts36: per36(s.pts),
    tpar: div(s.tpa, s.fga), ftr: div(s.fta, s.fga),
    pts3: div(s.tpm != null ? 3 * s.tpm : null, s.pts), ptsFt: div(ftm, s.pts),
    astPct: s.ast != null && t?.fgm != null ? div(s.ast, (m / 48) * t.fgm - (s.fgm || 0)) : null,
    astTo: div(s.ast, s.to), ast36: per36(s.ast),
    tovPct: div(s.to, (s.fga || 0) + 0.44 * (s.fta || 0) + (s.to || 0)),
    orbPct: s.oreb != null && t?.oreb != null && L?.dreb != null ? div(s.oreb * 48, m * (t.oreb + L.dreb)) : null,
    drbPct: s.dreb != null && t?.dreb != null && L?.oreb != null ? div(s.dreb * 48, m * (t.dreb + L.oreb)) : null,
    trbPct: s.reb != null && t?.oreb != null && t?.dreb != null && L?.oreb != null ? div(s.reb * 48, m * (t.oreb + t.dreb + L.oreb + L.dreb)) : null,
    stlPct: s.stl != null && s.tposs ? div(s.stl * 48, m * s.tposs) : null,
    blkPct: s.blk != null && L?.fga != null && L?.tpa != null ? div(s.blk * 48, m * (L.fga - L.tpa)) : null,
    stl36: per36(s.stl), blk36: per36(s.blk), stocks36: s.stl != null && s.blk != null ? per36(s.stl + s.blk) : null,
    dreb36: per36(s.dreb), pf36: per36(s.pf),
  };
}
// p = porcentagem, n1/n2 = casas decimais; low = menor é melhor

const fmtAdv = (c, v) => v == null || !isFinite(v) ? '—' : c.f === 'p' ? (v * 100).toFixed(1).replace('.', ',') + '%' : v.toFixed(c.f === 'n2' ? 2 : 1).replace('.', ',');
