# Todo dia de manhã, baixa da NBA.com o aproveitamento defendido (DFG% vs FG%)
# e salva em data/defense.json. Também dá para rodar na hora pela aba Actions.
name: Atualizar dados de defesa

on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 no horário de Brasília (11:17 UTC)
  workflow_dispatch:         # botão "Run workflow" na aba Actions

permissions:
  contents: write            # necessário para salvar o arquivo atualizado no repositório

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dados da NBA.com
        run: python scripts/fetch_defense.py

      - name: Salvar no repositório (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/defense.json
          git diff --cached --quiet && echo "Sem mudanças hoje." && exit 0
          git commit -m "Atualiza dados de defesa ($(date -u +%Y-%m-%d))"
          git push
